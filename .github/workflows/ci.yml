name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Minimal feature set that works on CI without external dependencies
  CI_FEATURES: "native,neural"

# Minimal permissions
permissions:
  contents: read

jobs:
  # Quick checks that fail fast
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (CI features)
        run: cargo clippy --all-targets --features "$CI_FEATURES" -- -D warnings

      # The frontend feature is built by no other job: release.yml and
      # build-binaries.yml ship "native,neural,graph", and verify-nix.yml would
      # catch it but its paths: filter excludes src/**. Release 1.9.0 shipped a
      # commit fixing a duplicate import that made the feature entirely
      # unbuildable, and every job stayed green through it. rust-embed is
      # declared with allow_missing, so this needs no npm build of
      # frontend/dist — it reuses this job's warm cache and costs a recompile
      # of the crate itself.
      - name: Clippy (frontend feature)
        run: cargo clippy --all-targets --features "$CI_FEATURES,frontend" -- -D warnings

  # Main test suite
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true

      - name: Run tests
        run: cargo test --features "${{ env.CI_FEATURES }}" --verbose -- --test-threads=1

  # The graph feature is deliberately outside CI_FEATURES: oxigraph/RocksDB is
  # slow to compile, so it gets one Linux job instead of a slot in the 3-OS
  # matrix. It cannot be left uncovered either — release.yml builds the
  # published binaries with "native,neural,graph", and the feature has broken
  # three times behind CI's back (the lib build in 3ce10aa, and test code in
  # 24446b4 and when CallEdge gained `resolved`), each time noticed only when
  # someone happened to build it by hand.
  graph:
    name: Graph feature (Linux)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Own cache prefix: a graph build shares almost no artifacts with the
      # default one, and pointing both at the same key just evicts the other.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-graph"
          cache-on-failure: true

      - name: Clippy (graph)
        run: cargo clippy --all-targets --features "$CI_FEATURES,graph" -- -D warnings

      - name: Run tests (graph)
        run: cargo test --features "$CI_FEATURES,graph" -- --test-threads=1

  # The WASM build is documented (docs/wasm.md) and shipped, but nothing built
  # it: `index_snippet` gained a `repo` parameter and src/wasm.rs kept calling
  # it with the old arity, so the feature sat broken on main until someone
  # built it by hand. Check-only — wasm32 has no test runner here, and a
  # compile failure is the whole failure mode this guards against.
  wasm:
    name: WASM feature
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      # Own cache prefix: a wasm32 build shares no artifacts with the host
      # ones, and a shared key would just evict them.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-wasm"
          cache-on-failure: true

      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features wasm -- -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit

  # Build release binaries
  build-release:
    name: Build Release Binaries
    needs: [test, graph, wasm, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-binaries.yml
